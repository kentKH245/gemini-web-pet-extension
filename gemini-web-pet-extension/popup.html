<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 350px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }
    h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
    }
    p.sub {
      margin: 0 0 14px 0;
      font-size: 12px;
      color: #64748b;
    }
    .state-row {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .state-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .state-name {
      font-size: 13px;
      font-weight: 600;
    }
    .state-desc {
      font-size: 11px;
      color: #64748b;
    }
    .preview-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .thumb {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      object-fit: contain;
      background: #f1f5f9;
    }
    .upload-label {
      background: #e0e7ff;
      color: #3730a3;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .upload-label:hover {
      background: #c7d2fe;
    }
    input[type="file"] {
      display: none;
    }
    .speed-row {
      margin: 12px 0;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .reset-btn {
      width: 100%;
      padding: 8px;
      border: 1px solid #fca5a5;
      background: #fef2f2;
      color: #b91c1c;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>🐻 Gemini Pet Settings</h2>
  <p class="sub">Upload transparent GIFs or multi-frame PNGs (select multiple files at once).</p>

  <div id="stateList"></div>

  <div class="speed-row">
    <label for="speedRange">Frame Speed: <span id="speedVal">250</span> ms/frame</label>
    <input type="range" id="speedRange" min="80" max="800" step="20" value="250" />
  </div>

  <button class="reset-btn" id="resetBtn">Reset to Default Bear</button>

  <script src="popup.js"></script>
</body>
</html>
